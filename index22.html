<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container{
            display: grid;
            grid-template-columns: 150px 150px 150px;
            grid-template-rows: 150px 150px 150px;
            gap: 15px;

           
    
        }

        .conten{
            background-color: aqua;
            border-radius: 5px;
        }

        #num1{
            grid-column: span 2;
        }

        #num3{
            grid-column: span 2;
            background-color: blue;
        }

        #num2{
            grid-row: span 2;
            background-color: brown;
        }

        #num5{
            grid-column: span 2;
            background-color: chartreuse;
        }

        .grid-section{
            display: flex;
            justify-content: center;
            align-items: center;
             background-color: black;
              height: 100vh;
        }
    </style>

</head>
<body>
    <div class="grid-section">
    <div class="container">
        <div class="conten" id="num1">1</div>
        <div class="conten" id="num2">2</div>
        <div class="conten" id="num3">3</div>
        <div class="conten">4</div>
        <div class="conten" id="num5">5</div>
    </div>
    </div>
</body>
</html>
